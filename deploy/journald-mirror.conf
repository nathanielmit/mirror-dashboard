# Cap journald disk usage so months of kiosk logs can't fill the NUC.
# Install to /etc/systemd/journald.conf.d/mirror.conf
[Journal]
SystemMaxUse=200M
SystemKeepFree=500M
SystemMaxFileSize=50M
MaxRetentionSec=2week
RuntimeMaxUse=50M

# --- power-loss hardening (added with the kiosk-resilience pass) ---

# Deliberately NOT Storage=volatile. Moving the journal entirely to tmpfs would
# cut disk writes to zero, but it also erases the logs on every power cut — and
# the logs from before a cut are the only evidence of what went wrong.
# Persistent storage stays; the writes get bounded instead.
Storage=persistent

# journald fsyncs the active journal every SyncIntervalSec. 5m is the default;
# stating it explicitly documents the exposure window: at most 5 minutes of log
# lines are lost on a power cut, in exchange for not fsyncing constantly.
SyncIntervalSec=5m

# kiosk.sh relaunches Chromium on crash and echoes each time. A relaunch loop
# (server down, GPU wedged) can emit thousands of lines/minute straight to disk.
# Stock burst is 10000/30s, effectively no limit here. Cap it so a runaway loop
# degrades to "N messages suppressed" instead of a sustained write storm.
RateLimitIntervalSec=30s
RateLimitBurst=500

# No auditd on this box and nothing reads the audit stream; don't pull it into
# the journal or pay to write it.
Audit=no
