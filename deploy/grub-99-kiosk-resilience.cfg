# Kiosk resilience — install to /etc/default/grub.d/99-kiosk-resilience.cfg
# Sourced by grub-mkconfig AFTER /etc/default/grub, so it wins without editing
# the packaged conffile (survives grub package upgrades cleanly).

# When a boot doesn't complete, GRUB leaves recordfail=1 in /boot/grub/grubenv,
# and the next boot shows the menu instead of booting straight through.
# Verified against this box's /etc/grub.d/00_header (line ~394):
#     if [ "${recordfail}" = 1 ] ; then
#       set timeout=${GRUB_RECORDFAIL_TIMEOUT:-30}
# So the unset default here is 30s, NOT an infinite wait — every power cut costs
# a 30-second menu on the wall display. Not a brick, but a visible one. 3s.
#
# This only works because /boot is a plain ext4 partition. 00_header's
# check_writable() silently disables recordfail entirely when /boot/grub sits on
# LVM/btrfs/zfs (GRUB can't write those). Root is on LVM here, /boot is not —
# if /boot ever moves onto the VG, this setting becomes a no-op.
GRUB_RECORDFAIL_TIMEOUT=3

# Normal (clean) boots stay instant — no reason to pay 3s when nothing failed.
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden

# fsck.repair=yes makes systemd-fsck run e2fsck with -y instead of -p (preen).
# Preen mode EXITS 4 on anything needing a human decision, and systemd then
# drops to an emergency shell. -y answers "yes" to every repair prompt, so a
# dirty ext4 journal after a power cut gets fixed unattended.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT fsck.repair=yes"
