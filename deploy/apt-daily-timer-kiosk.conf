# Kiosk resilience — install to BOTH:
#   /etc/systemd/system/apt-daily.timer.d/kiosk.conf
#   /etc/systemd/system/apt-daily-upgrade.timer.d/kiosk.conf
#
# This is the "unpredictable times" fix. Stock Ubuntu ships:
#   apt-daily.timer          OnCalendar=*-*-* 6,18:00   RandomizedDelaySec=12h
#   apt-daily-upgrade.timer  OnCalendar=*-*-* 6:00      RandomizedDelaySec=60m
# A 12-HOUR random smear means the metadata refresh can fire at literally any
# hour — including while someone is looking at the mirror — and it is a heavy
# disk writer. Pin both to a fixed 04:00 with zero randomization.
#
# Persistent=false matters here too: with Persistent=true a kiosk that was
# powered off overnight runs the missed job immediately at power-on, competing
# with Next.js startup and Chromium for I/O exactly when you want a fast boot.

[Timer]
# Clear the packaged schedule before setting ours (OnCalendar= accumulates).
OnCalendar=
OnCalendar=*-*-* 04:00:00
RandomizedDelaySec=0
Persistent=false
AccuracySec=1m
