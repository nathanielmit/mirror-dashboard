# Kiosk resilience — install to BOTH:
#   /etc/systemd/system/emergency.service.d/override.conf
#   /etc/systemd/system/rescue.service.d/override.conf
#
# Last-resort backstop for "never halts at an interactive prompt".
# If something still fails past fsck.repair=yes, systemd's default is to run
# systemd-sulogin-shell on the console and wait for a root password forever.
# Replace that with: shout to the console, wait 60s (an SSH window, if the
# network came up), then reboot and let fsck have another try.
#
# TRADEOFF — READ THIS: if the underlying fault is NOT transient, this turns a
# dead-at-a-prompt box into a reboot loop. The loop is not worse (both are down
# and need physical hands) and it self-heals for the transient case, which is
# what a power cut actually produces. To break the loop, interrupt at the GRUB
# menu and boot with `systemd.unit=emergency.target systemd.setenv=...`, or from
# a live USB delete these two override files.

[Unit]
Description=Kiosk policy: reboot instead of waiting at an emergency shell

[Service]
# Clear the inherited sulogin ExecStart before setting our own.
ExecStart=
ExecStart=-/usr/bin/bash -c 'echo "KIOSK EMERGENCY: boot failed. Rebooting in 60s. SSH in now to intervene." >/dev/console; sleep 60; /usr/bin/systemctl reboot --force'
# sulogin needs a TTY; our replacement must not try to claim one.
StandardInput=null
StandardOutput=journal+console
StandardError=journal+console
